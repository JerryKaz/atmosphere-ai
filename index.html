<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere AI · Weather with AI advice</title>
    <meta name="description" content="A clean weather app with hourly and 7-day forecasts, air quality, UV, sunrise and sunset, plus AI advice on what to wear and do." />
    <meta name="theme-color" content="#F6F7F3" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash. Light is the default.
      try {
        if (JSON.parse(localStorage.getItem('atmosphere_theme')) === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
